# Builds and tests every push and pull request: the core's checks (including the random composition test),
# the app's JVM tests and a debug build. No signing key is needed: without keystore.properties the release
# build is simply unsigned, and CI does not build it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Also checks that gradle-wrapper.jar is an official one.
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :core:check :app:testDebugUnitTest :app:assembleDebug

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7
